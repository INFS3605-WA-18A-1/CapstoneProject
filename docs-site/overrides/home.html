{% extends "main.html" %}

<!-- Landing page: render a hero section beneath the tabs instead of Markdown content.
     Styles live in docs/stylesheets/extra.css (.mdx-* classes). -->
{% block tabs %}
  {{ super() }}

  <!-- Landing-page-only overrides: hide the normal page chrome -->
  <style>
    .md-header { position: initial; }
    .md-main__inner { margin: 0; }
    .md-content { display: none; }
    @media screen and (min-width: 60em) {
      .md-sidebar--secondary { display: none; }
    }
    @media screen and (min-width: 76.25em) {
      .md-sidebar--primary { display: none; }
    }
  </style>

  <section class="mdx-container">
    <div class="md-grid md-typeset">
      <div class="mdx-hero">
        <div class="mdx-hero__content">
          <h1>{{ config.site_name }}</h1>
          <p>{{ config.site_description }}.</p>
          {% if page.next_page %}
            <a href="{{ page.next_page.url | url }}"
               title="{{ page.next_page.title | e }}"
               class="md-button md-button--primary">
              Get started
            </a>
          {% endif %}
          <a href="{{ config.repo_url }}" class="md-button">
            View on GitHub
          </a>
        </div>
      </div>
    </div>
  </section>
{% endblock %}

{% block content %}{% endblock %}
{% block footer %}{% endblock %}
